server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5433/order
    username: order
    password: order
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Explicit, not relied-on-by-default (T2): per-partition ordering under retries requires
      # this. Kafka 3.0+ clients default enable.idempotence to true already, but stating it here
      # means a future client-version change can't silently regress it. Asserted by
      # ProducerIdempotenceConfigTest, not just configured.
      properties:
        enable.idempotence: true
        acks: all
    # M3: order-service is now also a consumer — the orchestrator's own SagaEventListener, on
    # payments.events/inventory.events. Same manual-ack discipline as every M2 consumer, asserted
    # against the real factory by OrderServiceConsumerManualAckConfigTest, not just trusted here.
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
  jpa:
    hibernate:
      # No ddl-auto=update, ever (R3). "validate" fails fast if the entity mapping and the
      # Flyway-migrated schema ever drift, rather than silently doing nothing or doing more.
      ddl-auto: validate
    open-in-view: false

eventforge:
  # v2: accounts every service authenticates against. VIEWER reads; OPERATOR mutates.
  #
  # These are LOCAL DEVELOPMENT CREDENTIALS, not secrets. They are committed deliberately so
  # `make up` and the test suite work from a clean clone with no out-of-band setup, and this
  # project has no deployment, no real data and no real users to protect. The {noop} prefix says
  # exactly that: the password is stored unencoded. A real deployment overrides these with
  # {bcrypt} hashes supplied through the environment — the delegating encoder reads the prefix,
  # so that swap needs no code change.
  security:
    users:
      operator:
        password: "{noop}operator"
        roles: [OPERATOR]
      viewer:
        password: "{noop}viewer"
        roles: [VIEWER]
  outbox:
    relay:
      enabled: true
      topic: orders.events
  # M3 saga timeouts (constitution items 5-6) - not tuned, same posture as the relay's own
  # retry-backoff defaults (R2).
  saga:
    authorize-payment-timeout-ms: 10000
    reserve-inventory-timeout-ms: 10000
    refund-payment-timeout-ms: 10000
    max-compensation-attempts: 3
    sweep-interval-ms: 1000
  tracing:
    otlp-endpoint: http://localhost:4317
    sampling-probability: 1.0
  # v2 WS1: Idempotency-Key handling on POST /orders. Spelled out rather than left to the
  # record's defaults so the two values with real operational consequences are visible here.
  idempotency:
    # After this window a retry is treated as a new request and creates a second order — the
    # same honest consequence ADR-0012 records for processed_events retention. Not tuned (R2).
    ttl: 24h
    # How long a caller blocks behind another transaction's in-flight claim before getting a
    # retryable 409. This is a connection-pool-exhaustion bound, not a patience setting: a
    # blocked request pins a servlet thread and a pooled connection for its whole duration.
    # See ADR-0021 for the cost and the deferred non-blocking alternative.
    lock-timeout: 1s

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
