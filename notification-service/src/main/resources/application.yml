server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5436/notification
    username: notification
    password: notification
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# No eventforge.outbox.relay.* here either: notification-service is a terminal consumer, nothing
# downstream reacts to a notification being sent.

eventforge:
  # v2: accounts every service authenticates against. VIEWER reads; OPERATOR mutates.
  #
  # These are LOCAL DEVELOPMENT CREDENTIALS, not secrets. They are committed deliberately so
  # `make up` and the test suite work from a clean clone with no out-of-band setup, and this
  # project has no deployment, no real data and no real users to protect. The {noop} prefix says
  # exactly that: the password is stored unencoded. A real deployment overrides these with
  # {bcrypt} hashes supplied through the environment — the delegating encoder reads the prefix,
  # so that swap needs no code change.
  security:
    users:
      operator:
        password: "{noop}operator"
        roles: [OPERATOR]
      viewer:
        password: "{noop}viewer"
        roles: [VIEWER]
  tracing:
    otlp-endpoint: http://localhost:4317
    sampling-probability: 1.0

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
