server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5434/payment
    username: payment
    password: payment
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all
    consumer:
      auto-offset-reset: earliest
      # Manual ack only, never auto-commit (constitution item 2) - asserted against the real
      # factory by ConsumerManualAckConfigTest, not just trusted from this file.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
  jpa:
    hibernate:
      # No ddl-auto=update, ever (R3). "validate" fails fast if the entity mapping and the
      # Flyway-migrated schema ever drift, rather than silently doing nothing or doing more.
      ddl-auto: validate
    open-in-view: false

eventforge:
  # v2: accounts every service authenticates against. VIEWER reads; OPERATOR mutates.
  #
  # These are LOCAL DEVELOPMENT CREDENTIALS, not secrets. They are committed deliberately so
  # `make up` and the test suite work from a clean clone with no out-of-band setup, and this
  # project has no deployment, no real data and no real users to protect. The {noop} prefix says
  # exactly that: the password is stored unencoded. A real deployment overrides these with
  # {bcrypt} hashes supplied through the environment — the delegating encoder reads the prefix,
  # so that swap needs no code change.
  security:
    users:
      operator:
        password: "{noop}operator"
        roles: [OPERATOR]
      viewer:
        password: "{noop}viewer"
        roles: [VIEWER]
  outbox:
    relay:
      enabled: true
      topic: payments.events
  # M4: OTLP gRPC receiver Jaeger exposes (docker-compose's jaeger service) - see ADR-0017/0018.
  # Sampling probability 1.0 is a deliberate policy for this project, not a default left untouched
  # - see ADR-0019.
  tracing:
    otlp-endpoint: http://localhost:4317
    sampling-probability: 1.0

# M4 item 7: structured JSON logs carrying trace_id/span_id on every line - populated into MDC by
# EventForgeTracer/SpanHandle whenever a span is open, picked up automatically by Spring Boot's
# built-in ECS formatter (no Micrometer Tracing bridge needed for this part).
logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
