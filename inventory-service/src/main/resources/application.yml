server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5435/inventory
    username: inventory
    password: inventory
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

eventforge:
  outbox:
    relay:
      # M3: reservation semantics give inventory-service its first thing to publish
      # (InventoryReserved/InventoryReservationFailed) - the same generic relay mechanism M1 built,
      # no new relay code needed, exactly as the M2 comment here anticipated.
      enabled: true
      topic: inventory.events
  tracing:
    otlp-endpoint: http://localhost:4317
    sampling-probability: 1.0

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
